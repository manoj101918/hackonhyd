server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_buffering off;          # stream the agent's Server-Sent Events as they happen
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
